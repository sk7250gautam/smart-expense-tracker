<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction | Smart Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        💰 Smart Expense Tracker
    </div>

    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/history">History</a>
        <a href="/budget">Budget</a>
    </div>

</nav>


<main class="container">

    <div class="form-page">

        <div class="form-header">

            <h1>✏️ Edit Transaction</h1>

            <p>
                Update your transaction details.
            </p>

        </div>


        <form method="POST" class="expense-form">

            <div class="form-group">

                <label for="amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ transaction['amount'] }}"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    {% for category in [
                        "Food",
                        "Travel",
                        "Shopping",
                        "Bills",
                        "Education",
                        "Entertainment",
                        "Health",
                        "Salary",
                        "Other"
                    ] %}

                    <option
                        value="{{ category }}"
                        {% if transaction["category"] == category %}
                        selected
                        {% endif %}
                    >
                        {{ category }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="payment_method">
                    Payment Method
                </label>

                <select
                    id="payment_method"
                    name="payment_method"
                    required
                >

                    {% for method in [
                        "Cash",
                        "UPI",
                        "Debit Card",
                        "Credit Card",
                        "Net Banking",
                        "Other"
                    ] %}

                    <option
                        value="{{ method }}"
                        {% if transaction["payment_method"] == method %}
                        selected
                        {% endif %}
                    >
                        {{ method }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ transaction['date'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="note">
                    Note
                </label>

                <textarea
                    id="note"
                    name="note"
                    rows="4"
                    placeholder="Add a note..."
                >{{ transaction["note"] or "" }}</textarea>

            </div>


            <div class="form-buttons">

                <a
                    href="/history"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="submit-income"
                >
                    💾 Update Transaction
                </button>

            </div>

        </form>

    </div>

</main>


<footer>

    <p>
        Smart Expense Tracker • Built with Flask
    </p>

</footer>

</body>
</html>
