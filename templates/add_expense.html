<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Smart Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">💰 Smart Expense Tracker</div>

    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/history">History</a>
        <a href="/budget">Budget</a>
    </div>
</nav>


<main class="container">

    <div class="form-page">

        <div class="form-header">
            <h1>💸 Add Expense</h1>
            <p>Record your spending and keep track of your expenses.</p>
        </div>

        <form method="POST" class="expense-form">

            <div class="form-group">
                <label for="amount">Amount (₹)</label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                    required
                >
            </div>


            <div class="form-group">
                <label for="category">Category</label>

                <select id="category" name="category" required>

                    <option value="">Select category</option>

                    <option value="Food">🍔 Food</option>
                    <option value="Travel">🚗 Travel</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Bills">💡 Bills</option>
                    <option value="Education">📚 Education</option>
                    <option value="Entertainment">🎮 Entertainment</option>
                    <option value="Health">🏥 Health</option>
                    <option value="Other">📦 Other</option>

                </select>
            </div>


            <div class="form-group">
                <label for="payment_method">Payment Method</label>

                <select id="payment_method" name="payment_method" required>

                    <option value="">Select payment method</option>

                    <option value="UPI">📱 UPI</option>
                    <option value="Cash">💵 Cash</option>
                    <option value="Card">💳 Card</option>
                    <option value="Bank Transfer">🏦 Bank Transfer</option>

                </select>
            </div>


            <div class="form-group">
                <label for="date">Date</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >
            </div>


            <div class="form-group">
                <label for="note">Note</label>

                <textarea
                    id="note"
                    name="note"
                    rows="4"
                    placeholder="What did you spend this money on?"
                ></textarea>
            </div>


            <div class="form-buttons">

                <a href="/" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="submit-expense">
                    💾 Save Expense
                </button>

            </div>

        </form>

    </div>

</main>


<footer>
    <p>Smart Expense Tracker • Built with Flask</p>
</footer>

</body>
</html>
